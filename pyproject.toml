[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-flow-agent"
version = "0.1.0"
description = "Enterprise knowledge retrieval and workflow agent backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "email-validator>=2.3,<3.0",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"